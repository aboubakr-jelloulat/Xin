services:
  catalogdb:
    container_name: catalog_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=CatalogDb
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data
    networks:
      - Xin-network

  basketdb:
    container_name: basket_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=BasketDb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_basketdb:/var/lib/postgresql/data
    networks:
      - Xin-network

  orderdb:
     container_name: order_db
     environment:
       - ACCEPT_EULA=Y
       - SA_PASSWORD=ajelloul@1337
     restart: always
     ports:
        - "1433:1433"
     networks:
        - Xin-network

  distributedcache:
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data 
    networks:
      - Xin-network

  messagebroker:
    container_name: rabbitmq
    hostname: xin-mq
    environment:
        - RABBITMQ_DEFAULT_USER=ajelloul
        - RABBITMQ_DEFAULT_PASS=ajelloul@1337
    ports:
      - "5672:5672"    # AMQP protocol  (for app
      - "15672:15672"  # Management UI port
    volumes:
        - rabbitmq_data:/var/lib/rabbitmq
        - rabbitmq_logs:/var/log/rabbitmq
    networks:
        - Xin-network

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    networks:
      - Xin-network
    depends_on:
      - catalogdb

  catalog.api:
    container_name: catalog.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres
    ports:
      - "6000:8080"
    networks:
      - Xin-network
    depends_on:
      - catalogdb
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro


  basket.api:
    container_name: basket.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DataBase=host=basketdb;port=5432;Database=BasketDb;User Id=postgres;Password=postgres;Include Error Detail=true
      - ConnectionStrings__Redis=distributedcache:6379
      - "gRPC_URL=http://discount.grpc:8080"
      - MessageBroker__Host=amqp://messagebroker:5672
      - MessageBroker__UserName=ajelloul
      - MessageBroker__Password=ajelloul@1337
    ports:
      - "6001:8080"
    networks:
      - Xin-network
    depends_on:
      - basketdb
      - distributedcache
      - discount.grpc
      - messagebroker 
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro


  discount.grpc:
    container_name: discount.grpc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DataBase=Data Source=/app/data/discountDb
    ports:
      - "6002:8080"
    networks:
      - Xin-network
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      - discount_data:/app/data
  

  ordering.api:
    container_name: ordering.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__DataBase=Server=orderdb,1433;Database=OrderDb;User Id=sa;Password=ajelloul@1337;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;Command Timeout=30 
      - MessageBroker__Host=amqp://messagebroker:5672
      - MessageBroker__UserName=ajelloul
      - MessageBroker__Password=ajelloul@1337
      - FeatureManagement__OrderFullfilment=false
    ports:
      - "6003:8080"
      - "6063:8081"
    networks:
        - Xin-network
    depends_on:
        - orderdb
        - messagebroker 
        
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      - ordering_data:/app/data


networks:
  Xin-network:
    driver: bridge

volumes:
  postgres_catalog:
  postgres_basketdb:
  redis_data: 
  discount_data:
  ordering_data:
  rabbitmq_data:
  rabbitmq_logs:

